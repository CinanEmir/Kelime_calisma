<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Yeni Kelime Ekle - KelimePulse</title>
    <meta name="theme-color" content="#070b14">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/add-word-style.css">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</head>
<body>
    <div class="add-word-wrapper">
        <div class="add-word-card">
            <header class="form-header">
                <div class="form-title-group">
                    <h2><span>✨</span> Yeni Kelime Ekle</h2>
                    <p class="form-subtitle">Kelime havuzuna yeni bir İngilizce kelime kaydedin. Örnek cümle eklemek isteğe bağlıdır.</p>
                </div>
                <a href="main-screen.html" class="back-link" title="Ana ekrana geri dön">
                    <span>←</span>
                    <span>Ana Ekran</span>
                </a>
            </header>

            <form id="addWordForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="newWord"><span>🔤</span> İngilizce Kelime <small style="color:var(--accent-red); font-size: 0.8rem;">*Zorunlu</small></label>
                    <input type="text" id="newWord" placeholder="Örn: resilient" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="newMeaning"><span>🇹🇷</span> Türkçe Karşılığı <small style="color:var(--accent-red); font-size: 0.8rem;">*Zorunlu</small></label>
                    <input type="text" id="newMeaning" placeholder="Örn: dirençli, çabuk toparlanan" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="newWordType"><span>🏷️</span> Kelime Türü (YDS - İsteğe Bağlı)</label>
                    <select id="newWordType">
                        <option value="">Belirtilmemiş</option>
                        <option value="Fiil">Fiil (Verb)</option>
                        <option value="Sıfat">Sıfat (Adjective)</option>
                        <option value="İsim">İsim (Noun)</option>
                        <option value="Zarf">Zarf (Adverb)</option>
                        <option value="Phrasal Verb">Phrasal Verb (Öbek Fiil)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="newExampleEn"><span>🇬🇧</span> Örnek Cümle (İngilizce - İsteğe Bağlı)</label>
                    <textarea id="newExampleEn" placeholder="İsteğe bağlı: Örn: She is a resilient person who never gives up."></textarea>
                </div>

                <div class="form-group">
                    <label for="newExampleTr"><span>🇹🇷</span> Örnek Cümlenin Çevirisi (Türkçe - İsteğe Bağlı)</label>
                    <textarea id="newExampleTr" placeholder="İsteğe bağlı: Örn: O, asla pes etmeyen dirençli bir insandır."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" id="saveWordBtn" class="btn-primary">
                        <span>💾</span>
                        <span>Kelimeyi Havuzuna Kaydet</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/add-word.js"></script>
</body>
</html>
