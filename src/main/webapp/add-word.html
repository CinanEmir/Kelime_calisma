<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Yeni Kelime Ekle - KelimePulse</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/add-word-style.css">
</head>
<body>
    <div class="add-word-wrapper">
        <div class="add-word-card">
            <header class="form-header">
                <div class="form-title-group">
                    <h2><span>✨</span> Yeni Kelime Ekle</h2>
                    <p class="form-subtitle">Kelime havuzuna yeni bir İngilizce kelime ve örnek cümle kaydedin.</p>
                </div>
                <a href="main-screen.html" class="back-link" title="Ana ekrana geri dön">
                    <span>←</span>
                    <span>Ana Ekran</span>
                </a>
            </header>

            <form id="addWordForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="newWord"><span>🔤</span> İngilizce Kelime</label>
                    <input type="text" id="newWord" placeholder="Örn: resilient" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="newMeaning"><span>🇹🇷</span> Türkçe Karşılığı</label>
                    <input type="text" id="newMeaning" placeholder="Örn: dirençli, çabuk toparlanan" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="newExampleEn"><span>🇬🇧</span> Örnek Cümle (İngilizce)</label>
                    <textarea id="newExampleEn" placeholder="Örn: She is a resilient person who never gives up." required></textarea>
                </div>

                <div class="form-group">
                    <label for="newExampleTr"><span>🇹🇷</span> Örnek Cümlenin Çevirisi (Türkçe)</label>
                    <textarea id="newExampleTr" placeholder="Örn: O, asla pes etmeyen dirençli bir insandır." required></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" id="saveWordBtn" class="btn-primary">
                        <span>💾</span>
                        <span>Kelimeyi Havuzuna Kaydet</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/add-word.js"></script>
</body>
</html>
