<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KelimePulse - Hoş Geldiniz</title>
    <meta name="theme-color" content="#070b14">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</head>
<body>
    <div class="welcome-container" id="welcome-screen">
        <div class="welcome-icon">✨</div>
        <h1 class="welcome-title">KelimePulse</h1>
        <p class="welcome-subtitle">İngilizce kelime dağarcığınızı akıcı ve modern bir deneyimle geliştirin.</p>
        
        <div class="welcome-loading">
            <div class="spinner"></div>
            <span>Çalışma ortamı yükleniyor...</span>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
