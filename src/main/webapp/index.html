<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KelimePulse</title>
    <meta name="theme-color" content="#070b14">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</head>
<body class="splash-body">
    <div class="splash-screen" id="welcome-screen">
        <div class="splash-center">
            <div class="splash-logo-box">
                <img src="icons/icon-192.png" alt="KelimePulse Logo" class="splash-logo-img">
            </div>
            <h1 class="splash-title">KelimePulse</h1>
            <p class="splash-subtitle">YDS Kelime Kartları</p>
            
            <div class="splash-loader">
                <div class="splash-loader-bar"></div>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
